<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benne — Adventure Engine</title>
    <style>
      /* Pantalla de càrrega: aquí dins perquè es vegi abans que arribi res més (vegeu src/engine/bootLoadingScreen.ts) */
      html, body { margin: 0; height: 100%; background: #0f0f1a; }
      #carregant {
        position: fixed; inset: 0; z-index: 9000;
        display: grid; place-content: center; justify-items: center; gap: 14px;
        background: #0f0f1a; color: #c9c4d8;
        font: 600 13px/1.2 ui-monospace, "Courier New", monospace; letter-spacing: .18em; text-transform: uppercase;
        transition: opacity .45s ease;
      }
      #carregant.fet { opacity: 0; pointer-events: none; }
      #carregant .nom { font-size: 20px; letter-spacing: .12em; color: #f4f4f8; }
      #carregant .barra { box-sizing: border-box; width: 184px; height: 16px; padding: 3px; border: 2px solid #5c5670; overflow: hidden; }
      #carregant .barra i { display: block; height: 100%; width: 30%; background: #9cc46a; animation: carregant-va 1.1s steps(12) infinite alternate; }
      #carregant.amb-progres .barra i { animation: none; width: calc(var(--progres, 0) * 100%); transition: width .2s steps(4); }
      @keyframes carregant-va { from { transform: translateX(-10%); } to { transform: translateX(245%); } }
      @media (prefers-reduced-motion: reduce) { #carregant .barra i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="carregant" role="status" aria-live="polite">
      <span class="nom"><!--benne:nom--></span>
      <span class="barra" aria-hidden="true"><i></i></span>
      <span>Carregant…</span>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
