<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Benne — Adventure Engine</title>
    <style>
      /* Pantalla de càrrega: aquí dins perquè es vegi abans que arribi res més (vegeu src/engine/bootLoadingScreen.ts).
         Els colors de cada joc: `colors` al bloc `benne` del package.json (fons, text, nom, nom2, barra, vora). */
      html, body { margin: 0; height: 100%; background: var(--fons, #0f0f1a); }
      #carregant {
        position: fixed; inset: 0; z-index: 9000;
        display: grid; place-content: center; justify-items: center; gap: 18px;
        background: var(--fons, #0f0f1a); color: var(--text, #c9c4d8);
        font: 700 13px/1 ui-monospace, "Courier New", monospace; letter-spacing: .2em; text-transform: uppercase;
        transition: opacity .4s steps(4);
      }
      #carregant.fet { opacity: 0; pointer-events: none; }
      #carregant .nom {
        font-size: 30px; letter-spacing: .14em;
        background: linear-gradient(var(--nom, #f4f4f8) 55%, var(--nom2, var(--nom, #f4f4f8)) 55%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(3px 3px 0 #000);
      }
      #carregant .barra { box-sizing: border-box; width: 172px; height: 20px; padding: 4px; border: 2px solid var(--vora, #5c5670); box-shadow: 3px 3px 0 #000; overflow: hidden; }
      #carregant .barra i {
        display: block; height: 100%; width: 30px;
        background: repeating-linear-gradient(90deg, var(--barra, #9cc46a) 0 8px, transparent 8px 10px);
        animation: carregant-va 1.2s steps(13) infinite alternate;
      }
      #carregant.amb-progres .barra i { animation: none; width: calc(var(--progres, 0) * 160px); }
      #carregant .text::after { content: "_"; animation: carregant-cursor 1s steps(1) infinite; }
      @keyframes carregant-va { from { transform: translateX(0); } to { transform: translateX(130px); } }
      @keyframes carregant-cursor { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #carregant .barra i, #carregant .text::after { animation: none; } }
    </style>
    <!--benne:colors-->
  </head>
  <body>
    <div id="carregant" role="status" aria-live="polite">
      <span class="nom"><!--benne:nom--></span>
      <span class="barra" aria-hidden="true"><i></i></span>
      <span class="text">Carregant</span>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
